[package]
name = "aaa"
version = "0.1.1"
description = "别卷 - A quiz practice application"
authors = ["ssk-shandm"]
license = "MIT"
repository = "https://github.com/ssk-shandm/exam"
edition = "2021"

[lib]
name = "aaa_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
